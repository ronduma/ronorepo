[project]
name = "faceswap"
version = "0.1.0"
description = "Airgapped, GPU-accelerated face swapper with per-face selection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnx>=1.16",
]

[project.optional-dependencies]
# pick exactly one onnxruntime flavour
# NVIDIA (Windows / Linux); CUDA + cuDNN come as pip wheels, no toolkit install needed
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.22,<1.27"] # CUDA 12, driver 525+
cuda13 = ["onnxruntime-gpu[cuda,cudnn]>=1.27"]     # CUDA 13, driver 580+
directml = ["onnxruntime-directml>=1.22"]   # AMD / Intel / NVIDIA on Windows
cpu = ["onnxruntime>=1.22"]                 # fallback, slow

[project.scripts]
faceswap = "faceswap.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "cuda13" }, { extra = "directml" }, { extra = "cpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faceswap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
